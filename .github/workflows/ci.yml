name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['^12.0', '^13.0']
        deps: ['lowest', 'highest']
        include:
          - laravel: '^13.0'
            testbench: '^11.0'
          - laravel: '^12.0'
            testbench: '^10.0'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, json, mbstring
          coverage: ${{ (matrix.php == '8.3' && matrix.laravel == '^13.0' && matrix.deps == 'highest') && 'pcov' || 'none' }}
          ini-values: error_reporting=E_ALL

      - name: Pin framework versions
        run: |
          composer require --no-update --no-interaction --dev \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.deps }}

      - run: composer test

      - name: Coverage threshold
        if: matrix.php == '8.3' && matrix.laravel == '^13.0' && matrix.deps == 'highest'
        run: |
          composer coverage
          composer coverage:check

      - name: Mutation testing
        if: matrix.php == '8.3' && matrix.laravel == '^13.0' && matrix.deps == 'highest'
        run: composer mutate
